services:
  - type: web
    name: wryte-backend
    runtime: python
    rootDir: apps/backend
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn app.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
